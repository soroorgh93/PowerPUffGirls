name: ci
on: [push, pull_request]
jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements/base.txt && pip install -e . --no-deps
      - run: python scripts/make_synthetic_scenarios.py --out data/synthetic
      - run: python -m pytest -q
      - run: python scripts/benchmark.py --profile fixture --variants full fixed_pipeline --no-judge
